<svg viewBox="0 0 220 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Norton Equipment Co. emblem">
  <defs>
    <linearGradient id="steelG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9edf2"/><stop offset=".18" stop-color="#aeb6c0"/>
      <stop offset=".5" stop-color="#6a707b"/><stop offset=".78" stop-color="#aab2bd"/>
      <stop offset="1" stop-color="#dfe4ea"/>
    </linearGradient>
    <linearGradient id="steelG2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f5f9"/><stop offset=".5" stop-color="#8b929c"/><stop offset="1" stop-color="#c4cbd4"/>
    </linearGradient>
    <linearGradient id="necText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#c3cad3"/><stop offset="1" stop-color="#7f8791"/>
    </linearGradient>
    <radialGradient id="boltG" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffe9a8"/><stop offset=".4" stop-color="#e6b53f"/>
      <stop offset=".8" stop-color="#a9781a"/><stop offset="1" stop-color="#7c560f"/>
    </radialGradient>
    <pattern id="tread" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="13" height="13" fill="none"/>
      <path d="M2 4 L6 8 M7 5 L11 9" stroke="#ffffff" stroke-opacity=".16" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M2 4 L6 8 M7 5 L11 9" stroke="#000000" stroke-opacity=".22" stroke-width="1.4" stroke-linecap="round" transform="translate(0,1.4)"/>
    </pattern>
  </defs>
  <!-- outer dark frame -->
  <rect x="3" y="3" width="214" height="164" rx="12" fill="#0a0b0d"/>
  <!-- metal frame -->
  <rect x="8" y="8" width="204" height="154" rx="10" fill="url(#steelG)"/>
  <rect x="8" y="8" width="204" height="154" rx="10" fill="url(#tread)"/>
  <rect x="8.8" y="8.8" width="202.4" height="152.4" rx="9.4" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="1"/>
  <!-- black octagon plate -->
  <polygon points="46,26 174,26 200,52 200,118 174,144 46,144 20,118 20,52"
           fill="#0b0c0e" stroke="url(#steelG2)" stroke-width="3"/>
  <polygon points="46,26 174,26 200,52 200,118 174,144 46,144 20,118 20,52"
           fill="none" stroke="#000" stroke-opacity=".6" stroke-width="1" transform="scale(.985) translate(1.6,1.3)"/>
  <!-- NEC -->
  <text x="110" y="107" text-anchor="middle" font-family="Oswald, sans-serif" font-weight="700"
        font-size="76" letter-spacing="2" fill="url(#necText)" stroke="#0a0b0d" stroke-width="1.4"
        paint-order="stroke">NEC</text>
  <!-- gold hex bolts -->
  <g>
    <polygon points="20,85 27,73 41,73 48,85 41,97 27,97" fill="url(#boltG)" stroke="#5f3f0a" stroke-width="1.2"/>
    <polygon points="26,85 30,78 38,78 42,85 38,92 30,92" fill="none" stroke="#fff2c8" stroke-opacity=".5" stroke-width="1"/>
    <circle cx="30" cy="82" r="1" fill="#5f3f0a" opacity=".6"/><circle cx="37" cy="88" r="1" fill="#5f3f0a" opacity=".5"/>
  </g>
  <g>
    <polygon points="172,85 179,73 193,73 200,85 193,97 179,97" fill="url(#boltG)" stroke="#5f3f0a" stroke-width="1.2"/>
    <polygon points="178,85 182,78 190,78 194,85 190,92 182,92" fill="none" stroke="#fff2c8" stroke-opacity=".5" stroke-width="1"/>
    <circle cx="182" cy="82" r="1" fill="#5f3f0a" opacity=".6"/><circle cx="189" cy="88" r="1" fill="#5f3f0a" opacity=".5"/>
  </g>
</svg>